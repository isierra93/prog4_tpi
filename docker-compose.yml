services:
  db:
    image: postgres:16
    container_name: tpi_foodstore_db
    environment:
      POSTGRES_USER: foodstore
      POSTGRES_PASSWORD: foodstore
      POSTGRES_DB: foodstore_db
    ports:
      - "5433:5432"
    volumes:
      - tpi_foodstore_data:/var/lib/postgresql/data

volumes:
  tpi_foodstore_data:
